name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install SoftHSM and OpenSC (PKCS#11 test token)
        run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: go test ./...
      - name: Cross-compile every release target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/dsc
          done
